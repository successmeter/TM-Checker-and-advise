[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tm-advisor"
version = "0.2.0"
description = "Brand filing check for Australian trade mark applicants"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.6",
    "stripe>=12",
    "uvicorn>=0.29",
    "playwright>=1.40",  # PDF reports (headless Chromium)
    "tzdata; sys_platform == 'win32'",  # Australian time zone for report dates on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8"]
browser = ["playwright"]  # py -m tm_advisor.picklist_browser

[tool.setuptools]
packages = ["tm_advisor", "tm_advisor.register", "tm_advisor.manual", "tm_advisor.report"]

[tool.setuptools.package-data]
tm_advisor = ["static/*.html", "report/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
