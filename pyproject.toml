[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tm-advisor"
version = "0.1.0"
description = "Brand filing check for Australian trade mark applicants"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.6",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["tm_advisor", "tm_advisor.register"]

[tool.setuptools.package-data]
tm_advisor = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
