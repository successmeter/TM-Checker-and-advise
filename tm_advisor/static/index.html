<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TM Advisor</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1b; --muted: #5f5f5a; --line: #deded8;
    --accent: #2f5bd3; --high: #b42318; --high-bg: #fdecea; --med: #8a5a00; --med-bg: #fff4dc;
    --low: #1e6b3a; --low-bg: #e6f4ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #1f1f1d; --text: #ececea; --muted: #a3a39d; --line: #34342f;
      --accent: #7c9cf5; --high: #ff8a80; --high-bg: #3a1c1a; --med: #f5c26b; --med-bg: #362a12;
      --low: #81c995; --low-bg: #16301f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.15rem; margin: 28px 0 8px; }
  p.lead { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input[type=text], select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 96px; }
  .class-row { border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .consent { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; margin: 16px 0; }
  .consent input { margin-top: 5px; }
  .hint { color: var(--muted); font-size: .875rem; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 700; font-size: .875rem; }
  .High { color: var(--high); background: var(--high-bg); }
  .Medium { color: var(--med); background: var(--med-bg); }
  .Low { color: var(--low); background: var(--low-bg); }
  .note { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); font-size: .9rem; }
  .escalate { border-color: var(--high); }
  ul { margin: 6px 0; padding-left: 20px; }
  footer { color: var(--muted); font-size: .85rem; margin-top: 32px; }
  .error { color: var(--high); }
  #explain-box { margin-top: 24px; }
  .cites { font-size: .85rem; color: var(--muted); }
  .cites a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>TM Advisor</h1>
  <p class="lead">Check an Australian trade mark idea against the register, the goods &amp; services picklist and common examination problems, before you file it yourself.</p>

  <form id="form" class="card">
    <label for="mark">Your brand name (word mark)</label>
    <input type="text" id="mark" required maxlength="200" placeholder="e.g. EcoKnit">

    <div id="classes"></div>
    <div class="row" style="margin-top:8px">
      <button type="button" class="secondary" id="add-class">Add another class</button>
      <span class="hint">Each class costs a separate filing fee.</span>
    </div>

    <label class="consent">
      <input type="checkbox" id="consent">
      <span>I understand TM Advisor is software that gives automated information, not legal advice, and cannot guarantee IP Australia will accept my application.</span>
    </label>
    <button type="submit" id="run" disabled>Run check</button>
    <p id="error" class="error" role="alert"></p>
  </form>

  <section id="result" aria-live="polite"></section>
  <section id="explain-box" hidden>
    <button type="button" id="explain">Explain this in plain English</button>
    <span class="hint">Uses AI, grounded in IP Australia's Trade Marks Manual. Takes up to a minute.</span>
    <div id="explanation" aria-live="polite"></div>
  </section>

  <footer id="disclaimers"></footer>
</main>

<template id="class-template">
  <div class="class-row">
    <div class="row">
      <label style="margin:0">Class</label>
      <select class="class-number" style="width:auto"></select>
      <button type="button" class="secondary remove-class">Remove</button>
    </div>
    <label>Goods or services, one per line</label>
    <textarea class="terms" placeholder="Clothing&#10;Footwear&#10;Headwear"></textarea>
    <p class="hint">Tip: picklist wording is cheaper to file and avoids wording objections. Search it with <a href="/docs#/default/picklist_search_api_picklist_search_get" target="_blank">the picklist search</a>.</p>
  </div>
</template>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function addClass(number) {
  const node = $("#class-template").content.firstElementChild.cloneNode(true);
  const select = $(".class-number", node);
  for (let i = 1; i <= 45; i++) select.add(new Option(String(i), String(i), false, i === number));
  $(".remove-class", node).onclick = () => { if (document.querySelectorAll(".class-row").length > 1) node.remove(); };
  $("#classes").appendChild(node);
}
addClass(25);
$("#add-class").onclick = () => addClass(35);
$("#consent").onchange = (e) => { $("#run").disabled = !e.target.checked; };

fetch("/api/disclaimers").then(r => r.json()).then(list => {
  $("#disclaimers").innerHTML = list.map(d => `<p>${esc(d)}</p>`).join("");
});

let lastBody = null;

$("#form").onsubmit = async (e) => {
  e.preventDefault();
  $("#error").textContent = "";
  const classes = [...document.querySelectorAll(".class-row")].map(row => ({
    class_number: Number($(".class-number", row).value),
    terms: $(".terms", row).value.split("\n").map(t => t.trim()).filter(Boolean),
  }));
  const body = { mark: $("#mark").value, classes, consent: $("#consent").checked };
  lastBody = body;
  $("#explanation").innerHTML = "";
  $("#explain-box").hidden = true;
  $("#run").disabled = true;
  try {
    const response = await fetch("/api/check", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
    const data = await response.json();
    if (!response.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Please check the mark, classes and terms.");
    render(data);
    $("#explain-box").hidden = false;
  } catch (err) {
    $("#error").textContent = err.message;
  } finally {
    $("#run").disabled = !$("#consent").checked;
  }
};

$("#explain").onclick = async () => {
  const button = $("#explain");
  button.disabled = true;
  $("#explanation").innerHTML = "<p class=\"hint\">Working on it…</p>";
  try {
    const response = await fetch("/api/explain", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(lastBody) });
    const data = await response.json();
    if (!response.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Something went wrong.");
    renderExplanation(data);
  } catch (err) {
    $("#explanation").innerHTML = `<p class="error">${esc(err.message)}</p>`;
  } finally {
    button.disabled = false;
  }
};

function cites(list) {
  if (!list || !list.length) return "";
  return `<p class="cites">Manual: ${list.map(c => `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}${
    c.heading && c.heading !== c.title ? " › " + esc(c.heading) : ""}</a>`).join("; ")}</p>`;
}

function renderExplanation(data) {
  if (!data.explanation) {
    $("#explanation").innerHTML = `<p class="error">${esc(data.unavailable_reason)}</p>`;
    return;
  }
  const x = data.explanation;
  const parts = [`<h2>In plain English</h2><div class="card"><p>${esc(x.overview)}</p></div>`];
  for (const c of x.conflicts) {
    const conflict = data.report.conflicts.find(k => k.cited_number === c.cited_number);
    parts.push(`<div class="card"><strong>${esc(conflict ? conflict.cited_words : c.cited_number)}</strong>
      <p>${esc(c.explanation)}</p>${cites(c.citations)}</div>`);
  }
  if (x.distinctiveness) parts.push(`<div class="card"><strong>Distinctiveness</strong><p>${esc(x.distinctiveness.explanation)}</p>${cites(x.distinctiveness.citations)}</div>`);
  if (x.next_steps.length) parts.push(`<div class="card"><strong>Next steps to consider</strong><ul>${x.next_steps.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>`);
  parts.push(`<p class="note">Written by AI from the findings above${data.manual_excerpts_used ? " and passages of IP Australia's Trade Marks Manual" : " (the Manual index isn't set up, so no passages were used)"}. It can make mistakes and is not legal advice; follow the Manual links to read the source.</p>`);
  $("#explanation").innerHTML = parts.join("");
}

function render(r) {
  const parts = [];
  parts.push(`<h2>Result for ${esc(r.mark)} <span class="badge ${r.overall_risk}">${r.overall_risk} risk</span></h2>`);

  if (r.escalate) {
    parts.push(`<div class="card escalate"><strong>We suggest speaking to a registered trade marks attorney before filing.</strong><ul>${
      r.escalation_reasons.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`);
  }

  parts.push(`<h2>Similar marks on the register</h2>`);
  if (!r.conflicts.length) parts.push(`<p>No similar marks found for your classes. This is a screen, not a full search.</p>`);
  for (const c of r.conflicts) {
    parts.push(`<div class="card">
      <div class="row"><strong>${esc(c.cited_words)}</strong> <span class="hint">#${esc(c.cited_number)} · ${esc(c.cited_status)}${c.cited_owner ? " · " + esc(c.cited_owner) : ""}</span>
      <span class="badge ${c.risk}">${c.risk}</span></div>
      <ul>${c.mark_reasons.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      ${c.overlaps.map(o => `<p>Your class ${o.user_class} vs their class ${o.cited_class}: ${esc(o.note)}${
        o.overlapping_terms.length ? ` Your overlapping terms: <strong>${o.overlapping_terms.map(esc).join(", ")}</strong>.` : ""}</p>`).join("")}
      <p><strong>Option:</strong> ${esc(c.option)}</p>
      <p class="note">Based on automated matching against register data. Changing your goods/services changes what your registration protects, and the examiner decides.</p>
    </div>`);
  }

  parts.push(`<h2>Distinctiveness (section 41)</h2>`);
  if (!r.distinctiveness.length) parts.push(`<p>No descriptive or laudatory words found.</p>`);
  else parts.push(`<div class="card"><ul>${r.distinctiveness.map(f => `<li><strong>${esc(f.word)}</strong>: ${esc(f.reason)}</li>`).join("")}</ul>
    <p class="note">Distinctiveness is about the mark itself. Changing your goods list usually won't fix it; a more distinctive name or evidence of use might.</p></div>`);

  parts.push(`<h2>Goods &amp; services wording</h2>`);
  parts.push(`<div class="card"><p>${r.picklist_only
    ? "All your terms are on IP Australia's picklist."
    : "Some terms are not on the picklist. Picklist-only applications cost less and avoid wording objections."}</p><ul>${
    r.picklist.map(p => `<li>Class ${p.class_number}: ${esc(p.term)} ${p.on_picklist ? "✓ on picklist" :
      "— not on picklist" + (p.suggestions.length ? `; closest: ${p.suggestions.map(esc).join("; ")}` : "")}</li>`).join("")}</ul></div>`);

  $("#result").innerHTML = parts.join("");
}
</script>
</body>
</html>
